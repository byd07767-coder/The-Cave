<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الكهف ثلاثية الأبعاد - للموبايل</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            pointer-events: auto;
        }
        .hud-panel {
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 10px 15px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            text-align: center;
        }
        .mission-box {
            background: rgba(20, 15, 10, 0.9);
            border: 2px solid #f59e0b;
            color: #fbbf24;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(2,6,23,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen-overlay h1 {
            font-size: 30px;
            color: #60a5fa;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.6);
        }
        .screen-overlay p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-game {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.6);
        }
        #action-prompt {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.7);
            display: none;
            z-index: 10;
            text-align: center;
        }
        /* عناصر التحكم للموبايل (عصا تحكم + زر تفاعل) */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 20;
        }
        #joystick-base {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-handle {
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }
        #btn-interact {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: 3px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
            pointer-events: auto;
            cursor: pointer;
        }
        #btn-interact:active {
            transform: scale(0.92);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-panel">
                💎 البلورات: <span id="crystal-count">0</span> / 3
            </div>
            <div class="mission-box" id="mission-text">
                حرك الإصبع على الدائرة اليسرى، واجمع البلورات الثلاث!
            </div>
        </div>
    </div>

    <div id="action-prompt">اضغط زر التفاعل (⚙️) للهروب!</div>

    <!-- أزرار التحكم باللمس للموبايل -->
    <div class="mobile-controls">
        <div id="joystick-base">
            <div id="joystick-handle"></div>
        </div>
        <div id="btn-interact">تفاعل</div>
    </div>

    <div id="start-screen" class="screen-overlay">
        <h1>مغامرة الكهف 3D</h1>
        <p>استكشف الكهف المظلم، اجمع بلورات الطاقة الثلاث باستخدام عصا التحكم باللمس، وتوجه نحو المذبح للخروج!</p>
        <button class="btn-game" id="start-btn">ابدأ اللعبة</button>
    </div>

    <div id="win-screen" class="screen-overlay" style="display: none;">
        <h1>🎉 بطل المغامرة!</h1>
        <p>نجحت في جمع البلورات وهربت من الكهف بنجاح تام!</p>
        <button class="btn-game" onclick="location.reload()">العب مجدداً</button>
    </div>

    <script>
        let scene, camera, renderer, player, caveGroup;
        let crystals = [], collectedCrystals = 0;
        let altar, exitPortal;
        let gameStarted = false, gameWon = false;
        let interactTriggered = false;

        // متغيرات عصا التحكم (Joystick)
        let joystickActive = false;
        let joystickData = { x: 0, y: 0 };
        let touchId = null;

        function initGame() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);
            scene.fog = new THREE.FogExp2(0x050508, 0.035);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x1e1b4b, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.PointLight(0xf59e0b, 1.5, 30);
            mainLight.position.set(0, 4, 0);
            scene.add(mainLight);

            buildCaveEnvironment();
            createPlayer();
            createGameObjects();
            setupMobileControls();

            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;

            animate();
        }

        function buildCaveEnvironment() {
            caveGroup = new THREE.Group();

            const floorGeo = new THREE.PlaneGeometry(60, 60, 20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9, metalness: 0.1 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            caveGroup.add(floor);

            const ceilingGeo = new THREE.PlaneGeometry(60, 60, 15, 15);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 8;
            caveGroup.add(ceiling);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });
